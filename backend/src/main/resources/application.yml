server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: silver-care-iot-backend
  profiles:
    default: dev
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

silver-care:
  gateway:
    idle-timeout-seconds: 180
    max-client-threads: 200
    client-queue-capacity: 200
    accept-backlog: 128
    max-frame-length-bytes: 8192
  geocoding:
    connect-timeout-millis: 2000
    read-timeout-millis: 4000
  health:
    freshness-minutes: 180
  device-actions:
    connection-freshness-seconds: 180
    locate-timeout-seconds: 120
    health-timeout-seconds: 180
    timeout-scan-millis: 10000
